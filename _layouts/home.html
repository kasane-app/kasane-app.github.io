     動きの部品 scrollcraft.js・scrollcraft.css は MIT ライセンス(assets/LICENSE-scrollcraft.txt) -->
<html lang="{{ site.lang | default: 'ja' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/scrollcraft.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/home.css' | relative_url }}">
</head>
<body>


<div class="someiro" aria-hidden="true">
  <div class="dye"></div>
  <div class="dye"></div>
  <div class="dye"></div>
  <div class="dye"></div>
  <div class="dye"></div>
  <div class="dye"></div>
</div>
<div class="fiber" aria-hidden="true"></div>
<div class="sc-grain" aria-hidden="true"></div>

<header class="bar">
  <a class="word" href="#top"><img src="{{ '/assets/apple-touch-icon.png' | relative_url }}" alt="" width="28" height="28">KASANE</a>
  <a class="bar__cta" href="https://apps.apple.com/jp/app/id6819918637">App Storeでダウンロード</a>
</header>

<nav class="kasane-nav" aria-label="章">
  <a href="#origin" style="--c:var(--sumi)"><span>名前の由来</span><i></i></a>
  <a href="#heatmap" style="--c:var(--ai)"><span>ヒートマップ</span><i></i></a>
  <a href="#colors" style="--c:var(--chitose)"><span>光の色</span><i></i></a>
  <a href="#history" style="--c:var(--kokiake)"><span>毎日のグラフ</span><i></i></a>
  <a href="#privacy" style="--c:var(--edo)"><span>五つの約束</span><i></i></a>
  <a href="#download" style="--c:var(--kin)"><span>ダウンロード</span><i></i></a>
</nav>

<main id="top">
{{ content }}
</main>

<script src="{{ '/assets/scrollcraft.js' | relative_url }}"></script>
<script>ScrollCraft.mount(document.body);</script>
<script>
// このページだけの動き「紙に染みる重ね」:章を通るたびに、後ろの紙に色が一枚ずつしみて残る。
// 速さは紙に染みるくらい(目標へ毎フレーム少しずつ近づける)。動きを減らす設定では、最後の重なりを止めて見せる。
(function () {
  var reduce = ScrollCraft.reduce;
  var dyes = [].slice.call(document.querySelectorAll('.someiro .dye'));
  var layer = document.querySelector('.someiro');
  var navs = [].slice.call(document.querySelectorAll('.kasane-nav a'));
  var chaps = navs.map(function (a) { return document.querySelector(a.getAttribute('href')); });
  var close = document.getElementById('download');
  var bar = document.querySelector('.bar');
  var cur = dyes.map(function () { return 0; }), deep = 0, tops = [], closeTop = 0;

  function measure() {
    tops = chaps.map(function (el) { return el.getBoundingClientRect().top + scrollY; });
    closeTop = close.getBoundingClientRect().top + scrollY;
  }
  function targets() {
    var y = scrollY, vh = innerHeight;
    return {
      b: tops.map(function (t) { return Math.min(1, Math.max(0, (y + vh * 0.7 - t) / (vh * 0.9))); }),
      deep: Math.min(1, Math.max(0, (y + vh - closeTop) / (vh * 0.9)))
    };
  }
  function paint(t, k) {
    var moving = false;
    dyes.forEach(function (d, i) {
      var next = cur[i] + (t.b[i] - cur[i]) * k;
      if (Math.abs(next - cur[i]) > 0.0005) moving = true;
      cur[i] = next; d.style.setProperty('--b', next.toFixed(4));
    });
    var nd = deep + (t.deep - deep) * k;
    if (Math.abs(nd - deep) > 0.0005) moving = true;
    deep = nd; layer.style.setProperty('--deep', deep.toFixed(4));
    navs.forEach(function (a, i) { a.classList.toggle('is-on', t.b[i] > 0.5); });
    bar.classList.toggle('is-solid', scrollY > 40);
    return moving;
  }
  var raf = 0;
  function loop() { raf = 0; if (paint(targets(), 0.045)) raf = requestAnimationFrame(loop); }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  measure();
  if (reduce) {
    // 止まった絵:六枚とも重なった状態で、少し淡く
    dyes.forEach(function (d) { d.style.setProperty('--b', 1); });
    layer.style.setProperty('--deep', 0.4);
    var still = function () { var t = targets(); navs.forEach(function (a, i) { a.classList.toggle('is-on', t.b[i] > 0.5); }); bar.classList.toggle('is-solid', scrollY > 40); };
    addEventListener('scroll', still, { passive: true }); still();
  } else {
    addEventListener('scroll', kick, { passive: true }); kick();
  }
  addEventListener('resize', function () { measure(); kick(); });
  addEventListener('load', function () { measure(); kick(); });

  // 紹介動画:動きを減らす設定では自動で再生しない。再生・一時停止のボタンを置く
  var v = document.getElementById('promo'), btn = document.getElementById('promoBtn');
  function label() { btn.textContent = v.paused ? '再生' : '一時停止'; }
  btn.addEventListener('click', function () { if (v.paused) v.play(); else v.pause(); });
  v.addEventListener('play', label); v.addEventListener('pause', label);
  if (!reduce) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) v.play().catch(function () {}); else v.pause(); }); }, { threshold: 0.25 });
    io.observe(v);
  }
  label();
})();
</script>
</body>
</html>
